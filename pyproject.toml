[project]
name = "agents-tree"
version = "0.1.0"
description = "Show Claude Code sessions and their subagents as a live tree: model, effort, context use, elapsed time, status."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karel Blavka" }]
keywords = ["claude-code", "subagents", "agents", "cli", "tui", "herdr"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/blavka/agents-tree"
Issues = "https://github.com/blavka/agents-tree/issues"

[project.scripts]
agents-tree = "agents_tree.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
