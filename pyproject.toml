[project]
name = "agents-tree"
version = "1.0.0"
description = "Show Antigravity, Claude Code, Codex and Grok Build sessions and their subagents as a live tree: model, effort, context use, elapsed time, status."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karel Blavka" }]
keywords = ["antigravity", "claude-code", "codex", "grok-build", "subagents", "agents", "cli", "tui", "herdr"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/blavka/agents-tree"
Issues = "https://github.com/blavka/agents-tree/issues"

[project.scripts]
agents-tree = "agents_tree.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pylint>=4.1.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# Docstrings where they say something, and design limits judged in review, not by count.
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-branches",
    "too-many-return-statements",
    "too-few-public-methods",
    # Providers intentionally share find/cache/transcript shapes; judged in review.
    "duplicate-code",
]
